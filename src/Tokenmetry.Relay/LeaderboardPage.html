<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Tokenmetry 排行榜</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #171a21;
    --muted: #6b7280;
    --border: #e3e6eb;
    --accent: #2f5fe0;
    --accent-soft: #eef3ff;
    --row-hover: #f8f9fb;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 30px rgba(16, 24, 40, .05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014;
      --panel: #161920;
      --text: #e9ebf0;
      --muted: #9aa1ad;
      --border: #262b35;
      --accent: #82a6ff;
      --accent-soft: #1a2335;
      --row-hover: #1a1e27;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 44px 20px 64px;
  }

  .eyebrow {
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -.02em;
  }

  .muted { color: var(--muted); }

  #subtitle {
    max-width: 640px;
    margin: 8px 0 0;
    font-size: 14px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 8px;
  }

  .tabs {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
  }

  .tabs button,
  .month button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 999px;
    transition: background-color .15s ease, color .15s ease;
  }

  .tabs button {
    padding: 7px 16px;
  }

  .tabs button:hover { color: var(--text); }

  .tabs button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }

  .month {
    display: inline-flex;
    gap: 2px;
    align-items: center;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
  }

  .month button {
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 1;
  }

  .month button:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .month button:disabled {
    opacity: .35;
    cursor: default;
  }

  #month-label {
    min-width: 104px;
    padding: 0 6px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #status {
    min-height: 22px;
    margin: 12px 2px;
    font-size: 13px;
  }

  .table-wrap {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
  }

  th {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-align: left;
    text-transform: uppercase;
    white-space: nowrap;
  }

  td {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:first-child td { border-top: 0; }
  tbody tr:hover { background: var(--row-hover); }

  .rank {
    width: 58px;
    color: var(--muted);
  }

  .rank.top {
    color: var(--accent);
    font-weight: 700;
  }

  .num {
    text-align: right;
    white-space: nowrap;
  }

  .who {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .avatar {
    display: grid;
    flex: none;
    place-items: center;
    width: 28px;
    height: 28px;
    overflow: hidden;
    background: var(--accent-soft);
    border-radius: 50%;
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name {
    overflow: hidden;
    font-weight: 500;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty {
    margin: 16px 0 0;
    padding: 24px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    color: var(--muted);
    text-align: center;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
  }

  footer p { margin: 4px 0; }

  @media (max-width: 560px) {
    main { padding: 30px 14px 48px; }
    h1 { font-size: 25px; }
    .toolbar { margin-top: 22px; }
    th, td { padding: 10px 10px; }
    .rank { width: 38px; }
    .avatar { width: 24px; height: 24px; font-size: 12px; }
    .who { gap: 8px; }
    #month-label { min-width: 88px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Tokenmetry Relay</p>
  <h1 id="title">Tokenmetry 排行榜</h1>
  <p id="subtitle" class="muted">只显示已 opt-in 的账号；数据来自本中继的账号级聚合。</p>

  <section class="toolbar" aria-label="榜单筛选">
    <div class="tabs" role="group" aria-label="榜单">
      <button type="button" data-board="cost" aria-pressed="true">金额榜</button>
      <button type="button" data-board="tokens" aria-pressed="false">Token 榜</button>
    </div>
    <div class="month">
      <button type="button" id="prev-month" aria-label="上个月">‹</button>
      <span id="month-label"></span>
      <button type="button" id="next-month" aria-label="下个月">›</button>
    </div>
  </section>

  <p id="status" class="muted" role="status" aria-live="polite"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank" scope="col">#</th>
          <th id="col-account" scope="col">账号</th>
          <th id="col-tokens" class="num" scope="col">Token</th>
          <th id="col-cost" class="num" scope="col">金额 (USD)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p id="empty" class="empty" hidden>这个月还没有人 opt-in 上榜。</p>

  <noscript>
    <p class="empty">排行榜页面需要 JavaScript；也可以直接读取 / This page needs JavaScript; you can also
      read <code>api/leaderboard</code>。</p>
  </noscript>

  <footer class="muted">
    <p id="footer-privacy">只有显式开启排行榜的账号会出现；公开数据只有账号级 token / 成本合计，不含项目或会话明细。</p>
    <p><span id="footer-source">数据来自</span> <span id="origin"></span>。</p>
  </footer>
</main>

<script src="assets/relay-common.js"></script>
<script src="assets/leaderboard.js"></script>
</body>
</html>
