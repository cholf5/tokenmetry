# CI / packaging pipeline
#
# Triggers and behavior:
#   - PR / push to main: tests only (pure doc changes like **.md, LICENSE, docs/**
#     do not trigger; tag pushes ignore paths filters and always trigger).
#   - tag v*: after tests pass, package — macOS .app zip (scripts/package.sh,
#     arm64+x64, self-contained single-file), Windows win-x64 self-contained
#     single-file zip, Linux linux-x64 single-file zip — then create the GitHub
#     Release and upload the app packages. There is no separate "data" release
#     (unlike stupid-dict): every asset this app needs ships inside the packages.
#   - workflow_dispatch: manual packaging dry run (no release; artifacts on the run).
#
# Version convention: the release tag is vX.Y.Z and must equal the csproj
# <Version> of Tokenmetry.App (the comparison base of the in-app update
# check); scripts/release.sh bumps the csproj before tagging, and CI rejects
# a tag that disagrees.
#
# Asset naming contract (five assets): Tokenmetry-{version}-{rid}.zip with
# rid ∈ {osx-arm64, osx-x64, win-x64, linux-x64}, plus the Windows installer
# Tokenmetry-{version}-win-x64-setup.exe. The in-app updater
# (src/Tokenmetry.App/Update/UpdateAssets.cs) downloads by exactly these
# names — renaming assets here breaks "下载更新包" for every installed client,
# and picking the wrong one for installed copies breaks silent upgrades.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only changes do not trigger tests. Path filters are not evaluated
    # for tag pushes (per GitHub docs), so sharing this block with tags is safe.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  APP_PROJECT: src/Tokenmetry.App/Tokenmetry.App.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # csproj <Version>, used by the packaging jobs to name assets; on a tag
      # push it is validated against the tag here.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # The UI is zh-Hans-first: without a CJK font, headless rendering falls
      # back to a per-glyph fontconfig scan (order-of-magnitude slowdown) and
      # text layout may drift from what any real user sees.
      - name: Install CJK font for headless tests
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' "$APP_PROJECT" | head -1 | tr -d '[:space:]')
          [ -n "$VERSION" ] || { echo "cannot read <Version> from $APP_PROJECT" >&2; exit 1; }
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG=${GITHUB_REF_NAME#v}
              [ "$TAG" = "$VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match csproj <Version>$VERSION" >&2; exit 1; }
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run tests
        # verbosity=normal prints per-test lines: CI needs them to see progress
        # (a silent App.Tests phase is indistinguishable from a hang) and to
        # pin down slow tests; local runs stay on default verbosity.
        run: dotnet test Tokenmetry.sln --logger "console;verbosity=normal"

  # Packaging jobs run only on tag / manual triggers. The version comes from
  # the csproj <Version> as the single source, read once in the test job.
  # package.sh emits versioned asset names itself (Tokenmetry-{v}-{rid}.zip).
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.test.outputs.version }}
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Package .app bundle
        run: scripts/package.sh --rids "osx-${{ matrix.arch }}"
      - name: Check asset exists
        run: test -f "dist/Tokenmetry-${VERSION}-osx-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/Tokenmetry-*-osx-*.zip
          if-no-files-found: error

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Single-file self-contained: target machines need no .NET runtime.
      # The published exe is "Tokenmetry.App.exe" (assembly name); the shipped
      # binary is renamed to "Tokenmetry.exe" so the zip unpacks cleanly —
      # matching the .app executable name on macOS and the Linux binary name.
      # PublishReadyToRun (P-003): methods precompiled into the binary — smaller
      # JIT code heap at runtime (tray-resident memory matters) and faster
      # startup; costs ~30-50% package size (trade logged on card P-003).
      #
      # The staging layout (dist/publish/<rid> -> dist/stage/<rid>) mirrors
      # scripts/package.sh and is where installer/Tokenmetry.iss picks the
      # payload up from: one layout for local fallback and CI, no /D overrides.
      - name: Publish self-contained exe
        shell: pwsh
        run: >
          dotnet publish $env:APP_PROJECT -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o "dist/publish/win-x64"
      - name: Stage portable zip with product-name binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/stage/win-x64" | Out-Null
          Copy-Item "dist/publish/win-x64/Tokenmetry.App.exe" "dist/stage/win-x64/Tokenmetry.exe"
          Compress-Archive -Path "dist/stage/win-x64/Tokenmetry.exe" -DestinationPath "dist/Tokenmetry-$env:VERSION-win-x64.zip"
      # The installer gets a separate AOT build, not the portable single file:
      # Native AOT cannot be bundled into one file, and once the payload lives in
      # a fixed install directory the single-file form has no upside — AOT drops
      # the runtime, so startup needs no JIT warm-up and nothing is extracted to
      # %TEMP% (that extraction is both a startup cost and a classic AV/EDR
      # heuristic hit). AOT is compiled by MSVC from the windows-latest image.
      # Copy the whole publish directory instead of guessing which native
      # dependencies are required — flapping one out is a start-up crash.
      - name: Publish native AOT payload for the installer
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT -c Release -r win-x64
          -p:PublishAot=true -p:PublishSingleFile=false -p:SelfContained=true -o "dist/publish/win-x64-aot"
          New-Item -ItemType Directory -Force -Path "dist/stage/win-x64-aot" | Out-Null
          Copy-Item "dist/publish/win-x64-aot/*" "dist/stage/win-x64-aot" -Recurse
          Remove-Item "dist/stage/win-x64-aot/*.pdb", "dist/stage/win-x64-aot/*.xml" -ErrorAction SilentlyContinue
          Rename-Item "dist/stage/win-x64-aot/Tokenmetry.App.exe" "Tokenmetry.exe"
      # Installer is the primary Windows artifact: the zip stays for portable use,
      # but only the installer gives an uninstaller, Start-menu entry and a fixed
      # install path (which is what keeps HKCU\...\Run autostart valid).
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "installer\Tokenmetry.iss"
          if (-not (Test-Path "dist/Tokenmetry-$env:VERSION-win-x64-setup.exe")) { throw "installer not produced" }
      # Silent install -> files land -> silent uninstall -> files gone. This also
      # proves the [Run] postinstall entry fires under /SILENT (an in-app upgrade
      # must bring the app back on its own), so the installed app is asserted to
      # start and then stopped before uninstalling.
      - name: Smoke test installer (silent install + uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/Tokenmetry-$env:VERSION-win-x64-setup.exe"
          $dir = Join-Path $env:LOCALAPPDATA "Programs/Tokenmetry"
          $exe = Join-Path $dir "Tokenmetry.exe"

          # Never use Start-Process -Wait here: it waits for the whole process
          # tree, and the installer's [Run] entry relaunches Tokenmetry as its
          # child — that combination deadlocks until the job times out (v0.3.1
          # first dry run died exactly this way). Wait on the process handle
          # with an explicit timeout instead.
          function Invoke-Bounded([string]$file, [string[]]$arguments, [int]$timeoutMs) {
            Write-Host "run: $file $($arguments -join ' ')"
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit($timeoutMs)) {
              $process | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "timed out after ${timeoutMs}ms: $file"
            }
            Write-Host "exit code: $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw "$file exited with $($process.ExitCode)" }
          }

          Invoke-Bounded $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOCANCEL") 300000
          if (-not (Test-Path $exe)) { throw "installed exe missing: $exe" }
          if (-not (Test-Path (Join-Path $dir "unins000.exe"))) { throw "uninstaller missing" }
          Write-Host "installed: $exe"

          # [Run] postinstall must fire under /SILENT too — an in-app upgrade
          # has to bring the app back on its own, not leave the user staring at
          # a vanished window.
          $app = $null
          for ($i = 0; $i -lt 30; $i++) {
            $app = Get-Process -Name Tokenmetry -ErrorAction SilentlyContinue
            if ($app) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $app) { throw "[Run] postinstall did not start the app after a silent install" }
          Write-Host "app relaunched by installer: pid $($app.Id)"
          $app | Stop-Process -Force
          Start-Sleep -Seconds 2

          Invoke-Bounded (Join-Path $dir "unins000.exe") @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") 300000
          if (Test-Path $exe) { throw "uninstall left the exe behind: $exe" }
          Write-Host "uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          # Both the portable zip and the installer: the release ships them as a pair
          # (UpdateAssets picks the installer for installed copies, the zip otherwise).
          path: |
            dist/Tokenmetry-*-win-x64.zip
            dist/Tokenmetry-*-win-x64-setup.exe
          if-no-files-found: error

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Package binary
        run: scripts/package.sh --rids linux-x64
      # Boot smoke under a virtual X server: no human ever double-clicked the
      # Linux build, so this is the closest thing to a launch test CI can do.
      # It catches "dies during host/Avalonia/SQLite init" — the class of failure
      # a platform switch (e.g. Native AOT) would cause. Rendering correctness
      # still needs a real desktop.
      - name: Smoke test (xvfb boot)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          mkdir -p smoke && unzip -q dist/Tokenmetry-*-linux-x64.zip -d smoke
          chmod +x smoke/Tokenmetry
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          # --autostart: 托盘常驻启动（不弹主窗），最接近真实自启动路径。
          ./smoke/Tokenmetry --autostart > smoke/app.log 2>&1 &
          APP_PID=$!
          sleep 20
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::app exited during boot"; cat smoke/app.log; exit 1
          fi
          DB="$HOME/.local/share/Tokenmetry/tokenmetry.db"
          if [ ! -f "$DB" ]; then
            echo "::warning::tokenmetry.db not created at $DB"; ls -la "$HOME/.local/share" 2>/dev/null || true
          else
            echo "db created: $(stat -c%s "$DB") bytes"
          fi
          kill "$APP_PID" || true
          echo "boot smoke ok (process alive 20s)"
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/Tokenmetry-*-linux-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # checkout 只为取 docs/release/notes/<tag>.md（手写发版说明）；没写就回落
      # --generate-notes。首版没有上一个 tag 时 generate-notes 会把全部提交抖出来，
      # 所以首个版本必须提供手写文件。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="docs/release/notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARG="--notes-file $NOTES_FILE"
          else
            NOTES_ARG="--generate-notes"
          fi
          # 不给 --title 时 Release 标题是空串（v0.3.0 首版现场补过），一律给「Tokenmetry vX.Y.Z」。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tokenmetry ${GITHUB_REF_NAME}" $NOTES_ARG
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
